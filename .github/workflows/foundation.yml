name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust stable workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Inspect dependency tree
        run: cargo tree

  msrv:
    name: Rust 1.77.2 workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install exact MSRV toolchain
        run: rustup toolchain install 1.77.2 --profile minimal --component clippy

      - name: Verify exact MSRV toolchain
        run: |
          rustc +1.77.2 --version
          cargo +1.77.2 --version
          rustc +1.77.2 --version | grep '^rustc 1\.77\.2 '

      - name: Check workspace on MSRV
        run: cargo +1.77.2 check --workspace --locked

      - name: Lint workspace on MSRV
        run: cargo +1.77.2 clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace on MSRV
        run: cargo +1.77.2 test --workspace --locked
